server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed bundles are immutable; index.html and the .glb/.png assets are not.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
